<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SyncSpace ΓÇö Everything your team needs to move forward</title>
    <link rel="stylesheet" href="style.css" />
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
  <body>
    <div class="bg-orbs">
      <div class="orb orb--1"></div>
      <div class="orb orb--2"></div>
      <div class="orb orb--3"></div>
    </div>

    <canvas id="particles"></canvas>

    <main class="landing-wrap" id="page-content">
      <div class="landing-content">
        <div class="brand landing-brand">
          <div class="brand-icon">
            <svg width="26" height="26" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 9 L14 4 L24 9 L14 14 Z" fill="currentColor" opacity="0.9"/>
              <path d="M4 14 L14 19 L24 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <path d="M4 19 L14 24 L24 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5"/>
            </svg>
          </div>
          <span class="brand-name">SyncSpace</span>
        </div>

        <h1 class="landing-title">Everything your team needs to move forward.</h1>
        <p class="landing-desc">
          SyncSpace brings your projects, conversations, and files into one unified workspace.
          Collaborate in real time and keep your team aligned ΓÇö all in one place.
        </p>

        <div class="landing-actions">
          <button type="button" class="btn-primary btn-signin" data-href="login.html">
            <span>Sign In</span>
          </button>
          <button type="button" class="btn-secondary btn-signup" data-href="signup.html">
            <span>Sign Up</span>
          </button>
        </div>
      </div>
    </main>

    <script type="module" src="script.js"></script>
  </body>
</html>
