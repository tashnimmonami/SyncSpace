<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SyncSpace ΓÇö Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg-orbs">
      <div class="orb orb--1"></div>
      <div class="orb orb--2"></div>
      <div class="orb orb--3"></div>
    </div>

    <main class="welcome-wrap">
      <div class="welcome-brand">
        <div class="brand-icon">
          <svg width="26" height="26" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 9 L14 4 L24 9 L14 14 Z" fill="currentColor" opacity="0.9"/>
            <path d="M4 14 L14 19 L24 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M4 19 L14 24 L24 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5"/>
          </svg>
        </div>
        <span class="brand-name">SyncSpace</span>
      </div>

      <h1 class="welcome-title">Welcome to SyncSpace</h1>
      <p class="welcome-sub">You're signed in. The full dashboard is coming soon.</p>

      <button class="welcome-btn" onclick="window.location.href='login.html'">Sign out</button>
    </main>
  </body>
</html>
